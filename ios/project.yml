name: Coin
options:
  bundleIdPrefix: com.coinboxing
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TNK67SNT56
targets:
  Coin:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleLocalizations: [fr, en]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Coin sends each finished round to your coaching server on your home network.
    sources:
      - CoinApp.swift
      - CoachingClient.swift
      - ReviewRequestStore.swift
      - CoachingCopy.swift
      - PoseAnalysis.swift
      - GuardReview.swift
      - TrainingModel.swift
      - WorkoutCatalog.swift
      - WorkoutCatalog.json
      - SourceWorkoutLocalization.swift
      - BasicW1D1French.json
      - TrainingViews.swift
      - LiveWorkout.swift
      - ExchangeTracker.swift
      - RoundReport.swift
      - EvidenceCapture.swift
      - path: LocalConfig.json
        optional: true
      - VoiceCues/en_cooldown_speech.mp3
      - VoiceCues/en_free_late_cue.mp3
      - VoiceCues/en_free_mid_cue.mp3
      - VoiceCues/en_free_round_speech.mp3
      - VoiceCues/en_guard_late_cue.mp3
      - VoiceCues/en_guard_mid_cue.mp3
      - VoiceCues/en_guard_round_speech.mp3
      - VoiceCues/en_lunges_cue.mp3
      - VoiceCues/en_mobility_cue.mp3
      - VoiceCues/en_opening.mp3
      - VoiceCues/en_probe_late_cue.mp3
      - VoiceCues/en_probe_mid_cue.mp3
      - VoiceCues/en_rest_speech.mp3
      - VoiceCues/en_round_speech.mp3
      - VoiceCues/en_shadowboxing_cue.mp3
      - VoiceCues/en_squats_cue.mp3
      - VoiceCues/fr_cooldown_speech.mp3
      - VoiceCues/fr_free_late_cue.mp3
      - VoiceCues/fr_free_mid_cue.mp3
      - VoiceCues/fr_free_round_speech.mp3
      - VoiceCues/fr_guard_late_cue.mp3
      - VoiceCues/fr_guard_mid_cue.mp3
      - VoiceCues/fr_guard_round_speech.mp3
      - VoiceCues/fr_lunges_cue.mp3
      - VoiceCues/fr_mobility_cue.mp3
      - VoiceCues/fr_opening.mp3
      - VoiceCues/fr_probe_late_cue.mp3
      - VoiceCues/fr_probe_mid_cue.mp3
      - VoiceCues/fr_rest_speech.mp3
      - VoiceCues/fr_round_speech.mp3
      - VoiceCues/fr_shadowboxing_cue.mp3
      - VoiceCues/fr_squats_cue.mp3
      - pose_landmarker_full.task
      - Assets.xcassets
      - PrivacyInfo.xcprivacy
      - fr.lproj
      - en.lproj
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        PRODUCT_BUNDLE_IDENTIFIER: com.coinboxing.prototype
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Show your live workout and track visible movement; save a video only when you choose.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Include your training audio when recording a round.
        INFOPLIST_KEY_CFBundleDisplayName: Coin
        MARKETING_VERSION: '0.1.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: '1'
  CoinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [uitests]
    dependencies:
      - target: Coin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.coinboxing.prototype.uitests
        TEST_TARGET_NAME: Coin
  CoinTests:
    type: bundle.unit-test
    platform: iOS
    sources: [unittests]
    dependencies:
      - target: Coin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.coinboxing.prototype.tests
        FRAMEWORK_SEARCH_PATHS: '$(inherited) "$(PROJECT_DIR)/Pods/MediaPipeTasksVision/frameworks/MediaPipeTasksVision.xcframework/ios-arm64_x86_64-simulator" "$(PROJECT_DIR)/Pods/MediaPipeTasksCommon/frameworks/MediaPipeTasksCommon.xcframework/ios-arm64_x86_64-simulator"'
schemes:
  Coin:
    build:
      targets:
        Coin: all
        CoinUITests: [test]
        CoinTests: [test]
    test:
      targets: [CoinUITests, CoinTests]
